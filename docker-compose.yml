version: '3.8'

services:
  # Database service using PostgreSQL image
  database:
    image: vladtarnovskiy/postgres-db # Use the latest PostgreSQL image from Docker Hub
    build: ./prisma # Build the Docker image using the Dockerfile in the current directory
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    volumes:
      - database:/var/lib/postgresql/library
    networks:
      - appnet
  # Backend service
  backend:
    image: vladtarnovskiy/library-service
    build: . # Build the Docker image using the Dockerfile in the current directory
    restart: always
    ports:
      - ${PORT}:${PORT}
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${PG_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public
    depends_on:
      - database # Ensure that backend service starts after database service is up and running
    networks:
      - appnet

volumes:
  database:

networks:
  appnet:
    external: false
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
